<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
</head>
<body>
<h1>
    Muusika küsimustik
</h1>
<div>
    HTML vormid ja nupud
</div>
<form action="#">
    <!-- c + tab —> kommentaar -->
    <!-- Tekstkast -->
    <label for="nimi">
        Kirjutage oma nimi:
    </label>
    <input type="text" id="nimi" placeholder="Oleg Berezevski">
    <br>
    <!-- ripploend või rippmenüü -->
    <label for="stiil">Vali muusika stiil</label>
    <select name="stiil" id="stiil">
        <option value="vali">vali</option>
        <option value="hiphop">hiphop</option>
        <option value="rap">räp</option>
        <option value="kantri">kantri</option>
        <option value="rock">rock</option>
    </select>
    <br>
    <!-- radio nupud -üks valik mitmest -->
    <strong>
        Kuidas sa muusikat peamiselt kuulad?
    </strong>
    <br>
    <input type="radio" id="Spotify" name="platvorm">
    <label for="Spotify">Spotify</label>
    <br>
    <input type="radio" id="raadio" name="platvorm">
    <label for="raadio">Raadio</label>
    <br>
    <input type="radio" id="vinyyplaat" name="platvorm">
    <label for="vinyyplaat">Vinüüplaat</label>
</form>
</body>
</html>
