<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
    <link rel="stylesheet" href="style.css">
    <script src="../JavaScript/kysimustikScript.js"></script>
</head>
<body>
<h1>
    Muusika küsimustik
</h1>
<div>
    HTML vormid ja nupud
</div>
<br>
<form action="#">
    <!-- c + tab —> kommentaar -->
    <table >
        <tr>
            <td>
                <!-- Tekstkast -->
                <label for="nimi">
                Kirjutage oma nimi:
                </label>
            </td>
            <td>
                <input type="text" id="nimi" placeholder="Oleg Berezevski">
            </td>
            <td>
                <div id="vastus1"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="email">Sisestage oma email: </label>
            </td>
            <td>
                <input type="email" id="email" name="email">
            </td>
            <td>
                <div id="vastus2"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="telefon">Sisestage oma telefoni number:</label>
            </td>
            <td>
                <input type="tel" id="telefon" name="telefon" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}">
            </td>
            <td>
                <div id="vastus3"></div>
            </td>
        </tr>
        <tr>
            <td>
                <!-- ripploend või rippmenüü -->
                <label for="stiil">Vali muusika stiil</label>
            </td>
            <td>
                <select name="stiil" id="stiil">
                    <option value="vali">vali</option>
                    <option value="hiphop">hiphop</option>
                    <option value="rap">räp</option>
                    <option value="kantri">kantri</option>
                    <option value="rock">rock</option>
                </select>
            </td>
            <td>
                <div id="vastus4"></div>
            </td>
        </tr>
        <tr>
            <td>
                <!-- radio nupud -üks valik mitmest -->
                <strong>
                    Kuidas sa muusikat peamiselt kuulad?
                </strong>
            </td>
            <td>
                <input type="radio" id="Spotify" name="platvorm" value="Spotify">
                <label for="Spotify">Spotify</label>
                <br>
                <input type="radio" id="raadio" name="platvorm" value="Raadio">
                <label for="raadio">Raadio</label>
                <br>
                <input type="radio" id="vinyyplaat" name="platvorm" value="Vinüüplaat">
                <label for="vinyyplaat">Vinüüplaat</label>
            </td>
            <td>
                <div id="vastus5"></div>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <!-- Checkbox -->

                <fieldset>
                    <legend>Tee oma valikus - lemmik ansambel</legend>
                    <input type="checkbox" name="lemmikud" id="rollingstones" value="Rolling Stones">
                    <label for="rollingstones">Rolling Stones</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="radiohead" value="Radiohead">
                    <label for="radiohead">Radiohead</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="agatakristi" value="Agata Kristi">
                    <label for="agatakristi">Agata Kristi</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="lsp" value="LSP">
                    <label for="lsp">LSP</label>
                </fieldset>
            </td>
            <td>
                <div id="vastus6"></div>
            </td>
        </tr>
        <tr>
            <td>
                <!-- range - vahemik -->
                <label for="tund">Mitu tundi päevas sa kuulad muusikat</label>
            </td>
            <td>
                0<input type="range" id="tund" min="0" max="24" onchange="rangeValik()">24
            </td>
            <td>
                <div id="vastus7"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="viimanepaev">Mis päevas sa kuulsid muusikat viimases kordas?</label>

            </td>
            <td>
                <input type="date" id="viimanepaev" name="viimanepaev">

            </td>
        </tr>
        <tr>
            <td>
                <label for="muusikafail">Lisage muusika näidis</label>
            </td>
            <td>
                <input type="file" id="muusikafail" name="muusikafail" accept=".mp3">
            </td>
        </tr>
        <tr>
            <td>
                <label for="arvamus">Mida arvad muusika kuulamisest koolis?</label>
            </td>
            <td>
                <textarea name="arvamus" id="arvamus" cols="30" rows="10"></textarea>
            </td>
            <td>
                <div id="vastus10"></div>
            </td>
        </tr>
        <tr>
            <td>Kas sa kuulad raadiot?</td>
            <td>
                <input type="radio" id="jah" name="jahei" value="Jah">
                <label for="jah">Jah</label>
                <br>
                <input type="radio" id="ei" name="jahei" value="Ei">
                <label for="ei">Ei</label>
            </td>
            <td>
                <div id="vastus11"></div>
            </td>
        </tr>
        <tr>
            <td><label for="radiojaam">Milliseid raadiojaamu oskad nimetada?</label></td>
            <td>
                <input type="text" id="radiojaam" placeholder="humorFM">
            </td>
            <td>
                <div id="vastus12"></div>
            </td>
        </tr>
        <tr>
            <td>
                <input type="button" onclick="koikFunc()" value="Näita/Loe Andmed">
            </td>
            <td>
                <input type="button" value="Puhasta" onclick="puhasta()">
            </td>
            <td>
                <div id="vastusKoik"></div>
            </td>
        </tr>
    </table>
    <br>

</form>
</body>
</html>
