<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Programmeerimise küsimustik</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/ui/1.14.2/jquery-ui.min.js" integrity="sha256-mblSWfbYzaq/f+4akyMhE6XELCou4jbkgPv+JQPER2M=" crossorigin="anonymous"></script>

  <script>
    $(function(){
      // peidame vead
      $('.viga').hide();

      // puhastusnupp
      $('#puhasta').click(function(){
        $('#progVorm')[0].reset();
        $('.viga').hide();
      });

      // valideerimine, kui vorm on saadetud
      $('#progVorm').submit(function(event){
        let valid = true;

        // 1. Checkbox
        if($('input[name="keel"]:checked').length === 0){
          $('#viga1').show();
          valid = false;
        } else { $('#viga1').hide(); }

        // 2. Textarea
        if($('#arvamus').val().trim() === ""){
          $('#viga2').show();
          valid = false;
        } else { $('#viga2').hide(); }

        // 3. Number (0–24)
        let tunnid = $('#tund').val();
        if(tunnid === "" || isNaN(tunnid) || tunnid < 0 || tunnid > 24){
          $('#viga3').show();
          valid = false;
        } else { $('#viga3').hide(); }

        // 4. Radio
        if($('input[name="jahei"]:checked').length === 0){
          $('#viga4').show();
          valid = false;
        } else { $('#viga4').hide(); }

        // 5. Text (ainult tähed)
        let tekst = $('#IDE').val().trim();
        if(tekst === "" || !/^[a-zA-Z\s]+$/.test(tekst)){
          $('#viga5').show();
          valid = false;
        } else { $('#viga5').hide(); }

        // 6. Select
        if($('#lemKeel').val() === ""){
          $('#viga6').show();
          valid = false;
        } else { $('#viga6').hide(); }

        // kui on vead, siis ei ole vaja vormi saada
        if(!valid){
          event.preventDefault();
        } else {
          alert("Vorm on edukalt saadetud!");
        }
      });
    });

  </script>
</head>
<body>
<h1>
  Programmeerimise küsimustik
</h1>
<br>
<form action="#" id="progVorm">
  <table id="progKysimustik">
    <tr>
      <td colspan="2">
        <fieldset>
          <legend>Milliseid programmeerimiskeeli sa tead? </legend>
          <input type="checkbox" name="keel" id="javaScript" value="Java Script" onchange="checkboxValik()">
          <label for="javaScript">Java Script</label>
          <br>
          <input type="checkbox" name="keel" id="CSharp" value="C#" onchange="checkboxValik()">
          <label for="CSharp">C#</label>
          <br>
          <input type="checkbox" name="keel" id="java" value="Java" onchange="checkboxValik()">
          <label for="java">Java</label>
          <br>
          <input type="checkbox" name="keel" id="cpp" value="C++" onchange="checkboxValik()">
          <label for="cpp">C++</label>
          <br>
          <input type="checkbox" name="keel" id="php" value="PHP" onchange="checkboxValik()">
          <label for="php">PHP</label>
        </fieldset>
      </td>
      <td>
        <div id="vastus1"></div>
        <span id="viga1" class="viga"></span>
      </td>
    </tr>
    <tr>
      <td>
        <label for="arvamus">Mida arvad programmeerimise õppimisest?</label>
      </td>
      <td>
        <textarea name="arvamus" id="arvamus" cols="30" rows="10" oninput="ArvamuseLugemineKastist()"></textarea>
      </td>
      <td>
        <div id="vastus2"></div>
        <span id="viga2" class="viga"></span>
      </td>
    </tr>
    <tr>
      <td>
        <label for="tund">Mitu tundi nädalas tegeled programmeerimisega?</label>
      </td>
      <td>
        0<input type="range" id="tund" min="0" max="24" onchange="rangeValik()">24
      </td>
      <td>
        <div id="vastus3"></div>
        <span id="viga3" class="viga"></span>
      </td>
    </tr>
    <tr>
      <td>Kas sulle meeldib programmeerida?</td>
      <td>
        <input type="radio" id="jah" name="jahei" value="Jah" onclick="radioValik2()">
        <label for="jah">Jah</label>
        <br>
        <input type="radio" id="ei" name="jahei" value="Ei" onclick="radioValik2()">
        <label for="ei">Ei</label>
      </td>
      <td>
        <div id="vastus4"></div>
        <span id="viga4" class="viga"></span>
        <img id="jaheiPilt" src="../../pildid/vali.png" alt="vali">
      </td>
    </tr>
    <tr>
      <td>
        <!-- Tekstkast -->
        <label for="IDE">
          Milliseid programmeerimisega seotud tööriistu oskad nimetada?
        </label>
      </td>
      <td>
        <input type="text" id="IDE" placeholder="Visual Studio Code" oninput="ide()">
      </td>
      <td>
        <div id="vastus5"></div>
        <span id="viga5" class="viga"></span>
      </td>
    </tr>
    <tr>
      <td>
        <label for="lemKeel">Millist programmeerimiskeelt sooviksid kõige rohkem õppida?</label>
      </td>
      <td>
        <select name="lemKeel" id="lemKeel" onchange="selectValik()">
          <option value="vali">vali...</option>
          <option value="C++">C++</option>
          <option value="C#">C#</option>
          <option value="Java">Java</option>
          <option value="Java Script">Java Script</option>
          <option value="PHP">PHP</option>
          <option value="Python">Python</option>
        </select>
      </td>
      <td>
        <div id="vastus6"></div>
        <span id="viga6" class="viga"></span>
      </td>
    </tr>
    <tr>
      <td>
        <input type="submit" onclick="saada()" value="Näita/Loe Andmed">
      </td>
      <td colspan="2">
        <input type="reset" value="Puhasta" id="puhasta" onclick="puhasta()">
      </td>
    </tr>
    <tr>
      <td colspan="3">
        <div id="kokku"></div>
      </td>
    </tr>
  </table>
</form>
</body>
</html>
