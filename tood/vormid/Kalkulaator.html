<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Kalkulaatorid</title>
    <link rel="stylesheet" href="kalkStyle.css">
    <script src="../JavaScript/kalk1Script.js"></script>
    <script src="../JavaScript/kalk2Script.js"></script>
    <script src="../JavaScript/kalk3Script.js"></script>
</head>
<body>
<h1>Kalkulaatorid</h1>
<section id="yld">
    <!-- css paigutus flex row -->
    <section id="kalk1">
        <h2>meetri/tolli kalkulaator</h2>
        <label for="arv">Sisesta arv</label>
        <input type="number" id="arv" min="1" max="100" step="1" value="10" onchange="teisendamine()">
        <br>
        <input type="radio" name="valik" id="meeter" value="meeter" onchange="teisendamine()">
        <label for="meeter">Meeter</label>
        <br>
        <input type="radio" name="valik" id="tolli" value="tolli" onchange="teisendamine()">
        <label for="tolli">Tol</label>
        <br>
        <div id="vastus"></div>
        <img id="smile" src="../pildid/smile.png" alt="See on meetri kalkulaator">
    </section>
    <section id="kalk2">
        <h2>Joogi kalkulaator</h2>
        <label for="kogus">Mitu tk soovid: </label>
        <input type="number" id="kogus" min="1" max="10" step="1" value="1" onchange="jookideValik()">
        <label for="joogiValik">Vali jooki: </label>
        <select name="JoogiValik" id="joogiValik" onchange="jookideValik()">
            <option value="Vali">Vali...</option>
            <option value="Coca-Cola">Coca-Cola</option>
            <option value="Fanta">Fanta</option>
            <option value="Lipton">Lipton</option>
            <option value="Vesi">Vesi</option>
        </select>
        <br>
        <div id="vastus2"></div>
    </section>

    <section id="kalk3">
        <h2>Pindala ja ruumala kalkulaator meetritega</h2>
        <label class="a" for="a">A: </label>
        <input type="number", class="a", min="1", max="100", step="1", value="1", onchange="arvuta_suurus()">
        <br>
        <label class="b",for="b">B: </label>
        <input type="number", class="b", mix="1", max="100", step="1", value="1", onchange="arvuta_suurus()">
        <br>
        <label class="c" for="c", hidden="true">C: </label>
        <input type="number", class="c", mix="1", max="100", step="1", value="1", hidden="true", onchange="arvuta_suurus()">
        <br>
        <input type="radio" name="valik2" id="pindala" value="pindala", onchange="arvuta_suurus()">
        <label for="pindala">Pinadala</label>
        <select name="kujund" id="kujund" onchange="arvuta_suurus()">
            <option value="Vali">Vali...</option>
            <option value="Ring">Ring</option>
            <option value="Ruut">Ruut</option>
            <option value="Kolmnurk">Kolmnurk</option>
        </select>
        <br>
        <input type="radio" name="valik2" id="ruumala" value="ruumala", onchange="arvuta_suurus()">
        <label for="ruumala">Ruumala</label>
        <br>
        <div id="vastus3"></div>
    </section>
</section>
</body>
</html>
