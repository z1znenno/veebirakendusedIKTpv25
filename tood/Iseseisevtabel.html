<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Iseseisev Tabel</title>
    <link rel="stylesheet" href="iseseisev.css">
</head>
<body>
<h1>Iseseisev tabel</h1>
<table id="IseseisevTabel">
    <tr>
        <td rowspan="2">A</td>
        <td colspan="6">B</td>
        <td rowspan="2" colspan="2">C</td>
    </tr>
    <tr>
        <td colspan="2" rowspan="2">D</td>
        <td colspan="2" rowspan="2">E</td>
        <td colspan="2" rowspan="2">F</td>
    </tr>
    <tr>
        <td>1</td>
        <td colspan="2">5</td>
    </tr>
    <tr>
        <td>2</td>
        <td colspan="4">3</td>
        <td colspan="4">4</td>
    </tr>
</table>
</body>
</html>
